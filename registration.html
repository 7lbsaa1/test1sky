<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إنشاء حساب — sky7</title><link rel="icon" href="https://cdn-icons-png.flaticon.com/128/7978/7978734.png"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/global.css"><link rel="stylesheet" href="/css/auth.css"></head><body class="auth-page"><main class="auth-layout"><section class="auth-visual"><p class="eyebrow">انضم إلى مجتمع الصورة والضوء</p><h1>التقط<br><span>لحظتك.</span></h1><p>أنشئ ملفك، شارك صورك، واكتشف أشخاصًا يرون السماء كما تراها.</p></section><section class="auth-card glass-card"><a class="brand" href="/"><img src="https://cdn-icons-png.flaticon.com/128/7978/7978734.png" alt="sky7"><strong>sky<span>7</span></strong></a><div class="auth-heading"><h2>أنشئ حسابك</h2><p>ابدأ رحلتك البصرية في sky7</p></div><form id="registrationForm"><label>الاسم الكامل</label><input name="name" required placeholder="اسمك الكامل"><label>اسم المستخدم</label><input name="username" required placeholder="@username"><label>البريد الإلكتروني</label><input name="email" type="email" required placeholder="name@example.com"><label>كلمة المرور</label><input name="password" type="password" required minlength="6" placeholder="6 أحرف على الأقل"><label>تأكيد كلمة المرور</label><input name="confirmPassword" type="password" required placeholder="أعد كتابة كلمة المرور"><div id="registrationError" class="form-message error"></div><button id="registrationButton" class="btn btn-primary btn-wide" type="submit">إنشاء الحساب</button></form><p class="auth-switch">لديك حساب؟ <a href="/login">تسجيل الدخول</a></p></section></main><script type="module" src="/js/registration.js"></script></body></html>
