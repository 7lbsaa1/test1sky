<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول — sky7</title>
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/128/7978/7978734.png">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/global.css"><link rel="stylesheet" href="/css/auth.css">
</head>
<body class="auth-page">
  <main class="auth-layout">
    <section class="auth-visual"><div class="visual-glow"></div><p class="eyebrow">اكتشف العالم من زاوية مختلفة</p><h1>كل سماء<br><span>تحكي قصة.</span></h1><p>شارك لحظاتك الفوتوغرافية مع مجتمع يقدّر الضوء، السحب، والطبيعة.</p></section>
    <section class="auth-card glass-card">
      <a class="brand" href="/"><img src="https://cdn-icons-png.flaticon.com/128/7978/7978734.png" alt="sky7"><strong>sky<span>7</span></strong></a>
      <div class="auth-heading"><h2>مرحبًا بعودتك</h2><p>سجّل الدخول إلى مساحتك البصرية</p></div>
      <form id="loginForm" novalidate>
        <label for="email">البريد الإلكتروني</label><input id="email" name="email" type="email" autocomplete="email" placeholder="name@example.com" required>
        <label for="password">كلمة المرور</label><div class="password-field"><input id="password" name="password" type="password" autocomplete="current-password" placeholder="أدخل كلمة المرور" required><button type="button" class="icon-btn" data-toggle-password aria-label="إظهار كلمة المرور">◉</button></div>
        <div id="loginError" class="form-message error" role="alert"></div>
        <button id="loginButton" class="btn btn-primary btn-wide" type="submit"><span>تسجيل الدخول</span><span class="button-spinner" hidden></span></button>
      </form>
      <p class="auth-switch">ليس لديك حساب؟ <a href="/registration">أنشئ حسابًا الآن</a></p>
    </section>
  </main>
  <script type="module" src="/js/auth.js"></script>
</body></html>
